default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# cache: &cache
#   <<: *default
#   migrations_paths: db/cache_migrate
queue: &queue
  <<: *default
  migrations_paths: db/queue_migrate

development:
  primary:
    <<: *default
    database: mtasks_development
  # cache:
  #   <<: *cache
  #   database: myapp_development_cache
  queue:
    <<: *queue
    database: mtasks_dev_queue

test:
  <<: *default
  database: mtasks_test

production:
  primary:
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
  cache:
    <<: *cache
    url: <%= ENV['BLUE_DATABASE_URL'] %>
  queue:
    <<: *queue
    url: <%= ENV['DATABASE_QUEUE_URL'] %>
    migrations_paths: db/queue_migrate