<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Unprocessable Entity (422)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0B0A0A;
      color: #f3f4f6;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 32rem;
      text-align: center;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 700;
      color: #92E8D4;
      line-height: 1;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #e5e7eb;
    }

    p {
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    a {
      display: inline-block;
      padding: 0.625rem 1.5rem;
      background-color: #121111;
      color: #e5e7eb;
      text-decoration: none;
      border-radius: 0.375rem;
      border: 1px solid #22242B;
      font-weight: 500;
      transition: all 0.2s;
    }

    a:hover {
      background-color: #1E1D1D;
      border-color: #92E8D4;
      color: #92E8D4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">422</div>
    <h1>Unprocessable Entity</h1>
    <p>The change you wanted was rejected. Maybe you tried to change something you didn't have access to.</p>
    <a href="/">Go to Home</a>
  </div>
</body>
</html>
